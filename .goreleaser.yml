# GoReleaser configuration. Docs: https://goreleaser.com
version: 2

project_name: logbee

before:
  hooks:
    - go mod tidy

builds:
  - id: logbee
    main: .
    binary: logbee
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Tags like v1.2.0-rc.1 are published as GitHub pre-releases automatically.
release:
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
