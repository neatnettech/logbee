# GoReleaser configuration. Docs: https://goreleaser.com
version: 2

project_name: logbee

before:
  hooks:
    - go mod tidy

builds:
  - id: logbee
    main: .
    binary: logbee
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Tags like v1.2.0-rc.1 are published as GitHub pre-releases automatically.
release:
  prerelease: auto

# Publish a Homebrew formula to the neatnettech/homebrew-tap repo.
# skip_upload: auto -> formula is NOT pushed for pre-releases (rc) or
# snapshots, only for final vX.Y.Z tags. Requires a HOMEBREW_TAP_GITHUB_TOKEN
# secret with push access to the tap repo.
brews:
  - name: logbee
    repository:
      owner: neatnettech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/neatnettech/logbee"
    description: "Process manager for Procfile-based apps, with live log-file output"
    license: "MIT"
    skip_upload: auto
    install: |
      bin.install "logbee"
    test: |
      system "#{bin}/logbee", "--version"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
