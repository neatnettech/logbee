# GoReleaser configuration. Docs: https://goreleaser.com
version: 2

project_name: logbee

before:
  hooks:
    - go mod tidy

builds:
  - id: logbee
    main: .
    binary: logbee
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Tags like v1.2.0-rc.1 are published as GitHub pre-releases automatically.
release:
  prerelease: auto

# Publish a Homebrew formula into this same repo (Formula/logbee.rb).
# Single-repo tap: the built-in GITHUB_TOKEN (contents: write) pushes the
# formula, so no separate tap repo or PAT secret is needed.
# skip_upload: auto -> formula is NOT pushed for pre-releases (rc) or
# snapshots, only for final vX.Y.Z tags.
# Install: brew tap neatnettech/logbee https://github.com/neatnettech/logbee
#          brew install neatnettech/logbee/logbee
brews:
  - name: logbee
    repository:
      owner: neatnettech
      name: logbee
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/neatnettech/logbee"
    description: "Process manager for Procfile-based apps, with live log-file output"
    license: "MIT"
    skip_upload: auto
    install: |
      bin.install "logbee"
    test: |
      system "#{bin}/logbee", "--version"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
